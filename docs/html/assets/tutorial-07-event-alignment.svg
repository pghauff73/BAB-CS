<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1200 650">
  <title id="title">Tutorial 7 event-alignment timeline</title>
  <desc id="description">A timeline marks five exact switch events and explains the multistep-history restart sequence.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b7185"/><stop offset="1" stop-color="#174e63"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e1883b"/><stop offset="1" stop-color="#a6501d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#10243a" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4c7283"/></marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .title { fill:#10243a; font-size:29px; font-weight:820; letter-spacing:-0.02em; }
      .subtitle { fill:#60758a; font-size:15px; }
      .label { fill:#10243a; font-size:16px; font-weight:760; }
      .small { fill:#5e7388; font-size:13px; }
      .micro { fill:#74879a; font-size:10.5px; font-weight:720; letter-spacing:0.045em; }
      .box { fill:#fff; stroke:#d2dee8; stroke-width:1.5; }
      .soft { fill:#ebf6f8; stroke:#add3dd; stroke-width:1.5; }
      .warm { fill:#fff2e6; stroke:#edbd8f; stroke-width:1.5; }
      .line { fill:none; stroke:#4c7283; stroke-width:2.2; marker-end:url(#arrow); }
      .grid { stroke:#d9e4ec; stroke-width:1; }
    </style>
  </defs>
<rect width="1200" height="650" rx="28" fill="#f5f8fb"/>
  <text class="sans title" x="60" y="66">Tutorial 7 · Exact event alignment and restart</text>
  <text class="sans subtitle" x="60" y="100">A scheduled topology change is an integration boundary, not an ordinary point inside a long step.</text>
  <rect class="box" x="60" y="150" width="1080" height="340" rx="18"/>
  <path d="M110.0 315.0 H1090.0" stroke="#4c7283" stroke-width="4"/>
  <path d="M218.89 220 V410" stroke="#d9782d" stroke-width="3" stroke-dasharray="7 6"/>
  <circle cx="218.89" cy="315.0" r="9" fill="#0b7185"/>
  <text class="sans micro" x="218.89" y="200" text-anchor="middle">EVENT 1</text>
  <text class="sans small" x="218.89" y="438" text-anchor="middle">100 µs</text>
  <path d="M327.78 220 V410" stroke="#d9782d" stroke-width="3" stroke-dasharray="7 6"/>
  <circle cx="327.78" cy="315.0" r="9" fill="#0b7185"/>
  <text class="sans micro" x="327.78" y="200" text-anchor="middle">EVENT 2</text>
  <text class="sans small" x="327.78" y="438" text-anchor="middle">200 µs</text>
  <path d="M654.44 220 V410" stroke="#d9782d" stroke-width="3" stroke-dasharray="7 6"/>
  <circle cx="654.44" cy="315.0" r="9" fill="#0b7185"/>
  <text class="sans micro" x="654.44" y="200" text-anchor="middle">EVENT 3</text>
  <text class="sans small" x="654.44" y="438" text-anchor="middle">500 µs</text>
  <path d="M763.33 220 V410" stroke="#d9782d" stroke-width="3" stroke-dasharray="7 6"/>
  <circle cx="763.33" cy="315.0" r="9" fill="#0b7185"/>
  <text class="sans micro" x="763.33" y="200" text-anchor="middle">EVENT 4</text>
  <text class="sans small" x="763.33" y="438" text-anchor="middle">600 µs</text>
  <path d="M1090.00 220 V410" stroke="#d9782d" stroke-width="3" stroke-dasharray="7 6"/>
  <circle cx="1090.00" cy="315.0" r="9" fill="#0b7185"/>
  <text class="sans micro" x="1090.00" y="200" text-anchor="middle">EVENT 5</text>
  <text class="sans small" x="1090.00" y="438" text-anchor="middle">900 µs</text>
  <text class="sans label" x="110" y="535">At each event</text>
  <text class="sans small" x="110" y="566">Land exactly → accept the boundary solve → reset multistep history → take a startup step.</text>
  <text class="sans micro" x="1090" y="535" text-anchor="end">5 aligned events · 4 post-event startup steps</text>
</svg>
