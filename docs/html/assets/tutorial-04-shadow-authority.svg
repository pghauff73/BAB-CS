<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1200 650">
  <title id="title">Tutorial 4 · Shadow authority keeps observation separate from acceptance</title>
  <desc id="description">Shadow mode runs a candidate for diagnostics while the implicit reference still owns every accepted state.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b7185"/><stop offset="1" stop-color="#174e63"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e1883b"/><stop offset="1" stop-color="#a6501d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#10243a" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4c7283"/></marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .title { fill:#10243a; font-size:29px; font-weight:820; letter-spacing:-0.02em; }
      .subtitle { fill:#60758a; font-size:15px; }
      .label { fill:#10243a; font-size:16px; font-weight:760; }
      .small { fill:#5e7388; font-size:13px; }
      .micro { fill:#74879a; font-size:10.5px; font-weight:720; letter-spacing:0.045em; }
      .box { fill:#fff; stroke:#d2dee8; stroke-width:1.5; }
      .soft { fill:#ebf6f8; stroke:#add3dd; stroke-width:1.5; }
      .warm { fill:#fff2e6; stroke:#edbd8f; stroke-width:1.5; }
      .line { fill:none; stroke:#4c7283; stroke-width:2.2; marker-end:url(#arrow); }
      .grid { stroke:#d9e4ec; stroke-width:1; }
    </style>
  </defs>
<rect width="1200" height="650" rx="28" fill="#f5f8fb"/>
  <text class="sans title" x="60" y="66">Tutorial 4 · Shadow authority keeps observation separate from acceptance</text>
  <text class="sans subtitle" x="60" y="100">Shadow mode runs a candidate for diagnostics while the implicit reference still owns every accepted state.</text>
  <rect class="soft" x="52" y="178" width="240" height="170" rx="18" filter="url(#shadow)"/>
  <text class="sans micro" x="72" y="210">CURRENT STATE</text>
  <text class="sans label" x="72" y="244">Trusted input</text>
  <text class="sans small" x="72" y="276">One accepted state starts both paths.</text>
  <path class="line" d="M292 263 H327"/>
  <rect class="box" x="337" y="178" width="240" height="170" rx="18" filter="url(#shadow)"/>
  <text class="sans micro" x="357" y="210">CANDIDATE LANE</text>
  <text class="sans label" x="357" y="244">Proposal only</text>
  <text class="sans small" x="357" y="276">Work and defects are observed.</text>
  <path class="line" d="M577 263 H612"/>
  <rect class="box" x="622" y="178" width="240" height="170" rx="18" filter="url(#shadow)"/>
  <text class="sans micro" x="642" y="210">IMPLICIT LANE</text>
  <text class="sans label" x="642" y="244">Accepted authority</text>
  <text class="sans small" x="642" y="276">The independent solve owns state.</text>
  <path class="line" d="M862 263 H897"/>
  <rect class="soft" x="907" y="178" width="240" height="170" rx="18" filter="url(#shadow)"/>
  <text class="sans micro" x="927" y="210">EVIDENCE</text>
  <text class="sans label" x="927" y="244">Compare without promotion</text>
  <text class="sans small" x="927" y="276">Diagnostics remain visible.</text>
  <rect x="60" y="430" width="1080" height="140" rx="18" fill="#11344a"/>
  <text class="sans" x="88" y="468" fill="#ffffff" font-size="16" font-weight="800">Plain-language rule</text>
  <text class="sans" x="88" y="505" fill="#d8e7ef" font-size="14">Seeing a candidate trajectory is not the same as accepting it.</text>
  <text class="sans" x="88" y="535" fill="#d8e7ef" font-size="14">Shadow mode supports method study without silently transferring authority to the method under study.</text>
</svg>
