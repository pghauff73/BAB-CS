<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1200 690">
  <title id="title">BAB-CS qualification surface graph</title>
  <desc id="description">A horizontal bar graph of current test methods, comparison rows, observatory rows, power-stage rows, documents, teaching exercises, and mapped ngspice cases.</desc>
  <defs>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6a82"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="warm-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98237"/>
      <stop offset="1" stop-color="#9a4d1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10243a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#477083"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .title { fill: #10243a; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
      .subtitle { fill: #607386; font-size: 15px; }
      .label { fill: #10243a; font-size: 16px; font-weight: 750; }
      .small { fill: #607386; font-size: 13px; }
      .micro { fill: #718397; font-size: 11px; font-weight: 650; letter-spacing: 0.04em; }
      .box { fill: #ffffff; stroke: #d5e0e9; stroke-width: 1.5; }
      .soft { fill: #edf6f8; stroke: #b8d6df; stroke-width: 1.5; }
      .warm { fill: #fff4e9; stroke: #eac6a4; stroke-width: 1.5; }
      .line { fill: none; stroke: #477083; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #a6642e; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="690" rx="28" fill="#f5f8fb"/>
  <text class="sans title" x="60" y="66">Repository-owned qualification surface</text>
  <text class="sans subtitle" x="60" y="100">Counts are derived from current canonical files. Bar lengths use square-root scaling; exact values are printed.</text>
  <text class="sans label" x="60" y="162">Python test methods</text>
  <text class="sans small" x="60" y="189">syntax-derived</text>
  <rect x="350" y="142" width="700" height="46" rx="12" fill="#e6edf3"/>
  <rect x="350" y="142" width="650.00" height="46" rx="12" fill="url(#brand-gradient)"/>
  <text class="sans" x="1078" y="173" fill="#10243a" font-size="23" font-weight="850" text-anchor="end">306</text>
  <text class="sans label" x="60" y="230">Comparison matrix rows</text>
  <text class="sans small" x="60" y="257">8 canonical cases</text>
  <rect x="350" y="210" width="700" height="46" rx="12" fill="#e6edf3"/>
  <rect x="350" y="210" width="461.12" height="46" rx="12" fill="url(#brand-gradient)"/>
  <text class="sans" x="1078" y="241" fill="#10243a" font-size="23" font-weight="850" text-anchor="end">154</text>
  <text class="sans label" x="60" y="298">Observatory fixed-step rows</text>
  <text class="sans small" x="60" y="325">6 × 7 × 3</text>
  <rect x="350" y="278" width="700" height="46" rx="12" fill="#e6edf3"/>
  <rect x="350" y="278" width="417.10" height="46" rx="12" fill="url(#brand-gradient)"/>
  <text class="sans" x="1078" y="309" fill="#10243a" font-size="23" font-weight="850" text-anchor="end">126</text>
  <text class="sans label" x="60" y="366">Power-stage sandbox rows</text>
  <text class="sans small" x="60" y="393">reduced-order only</text>
  <rect x="350" y="346" width="700" height="46" rx="12" fill="#e6edf3"/>
  <rect x="350" y="346" width="280.54" height="46" rx="12" fill="url(#brand-gradient)"/>
  <text class="sans" x="1078" y="377" fill="#10243a" font-size="23" font-weight="850" text-anchor="end">57</text>
  <text class="sans label" x="60" y="434">Embedded Markdown documents</text>
  <text class="sans small" x="60" y="461">complete /docs tree</text>
  <rect x="350" y="414" width="700" height="46" rx="12" fill="#e6edf3"/>
  <rect x="350" y="414" width="232.05" height="46" rx="12" fill="url(#warm-gradient)"/>
  <text class="sans" x="1078" y="445" fill="#10243a" font-size="23" font-weight="850" text-anchor="end">39</text>
  <text class="sans label" x="60" y="502">Teaching lab exercises</text>
  <text class="sans small" x="60" y="529">executable exercises</text>
  <rect x="350" y="482" width="700" height="46" rx="12" fill="#e6edf3"/>
  <rect x="350" y="482" width="117.50" height="46" rx="12" fill="url(#warm-gradient)"/>
  <text class="sans" x="1078" y="513" fill="#10243a" font-size="23" font-weight="850" text-anchor="end">10</text>
  <text class="sans label" x="60" y="570">Mapped ngspice cases</text>
  <text class="sans small" x="60" y="597">scheduled external set</text>
  <rect x="350" y="550" width="700" height="46" rx="12" fill="#e6edf3"/>
  <rect x="350" y="550" width="166.18" height="46" rx="12" fill="url(#warm-gradient)"/>
  <text class="sans" x="1078" y="581" fill="#10243a" font-size="23" font-weight="850" text-anchor="end">20</text>
  <text class="sans micro" x="60" y="652">COUNTS DESCRIBE COVERAGE AND EVIDENCE VOLUME—NOT UNIVERSAL ACCURACY, SPEED, OR CERTIFICATION.</text>
</svg>
