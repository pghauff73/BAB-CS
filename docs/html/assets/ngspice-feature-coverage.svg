<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1200 900">
  <title id="title">ngspice semantic feature coverage</title>
  <desc id="description">A horizontal bar graph counts the mapping features exercised by the twenty-case external comparison manifest.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b7185"/><stop offset="1" stop-color="#174e63"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e1883b"/><stop offset="1" stop-color="#a6501d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#10243a" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4c7283"/></marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .title { fill:#10243a; font-size:29px; font-weight:820; letter-spacing:-0.02em; }
      .subtitle { fill:#60758a; font-size:15px; }
      .label { fill:#10243a; font-size:16px; font-weight:760; }
      .small { fill:#5e7388; font-size:13px; }
      .micro { fill:#74879a; font-size:10.5px; font-weight:720; letter-spacing:0.045em; }
      .box { fill:#fff; stroke:#d2dee8; stroke-width:1.5; }
      .soft { fill:#ebf6f8; stroke:#add3dd; stroke-width:1.5; }
      .warm { fill:#fff2e6; stroke:#edbd8f; stroke-width:1.5; }
      .line { fill:none; stroke:#4c7283; stroke-width:2.2; marker-end:url(#arrow); }
      .grid { stroke:#d9e4ec; stroke-width:1; }
    </style>
  </defs>
<rect width="1200" height="900" rx="28" fill="#f5f8fb"/>
  <text class="sans title" x="60" y="66">Semantic feature coverage across the 20 mapped cases</text>
  <text class="sans subtitle" x="60" y="100">Counts show how many declared cases exercise each translation feature; they are coverage volume, not correctness scores.</text>
  <text class="sans small" x="60" y="160">resistor</text>
  <rect x="330" y="135" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="135" width="700.00" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="159" text-anchor="end">17</text>
  <text class="sans small" x="60" y="210">capacitor</text>
  <rect x="330" y="185" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="185" width="658.82" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="209" text-anchor="end">16</text>
  <text class="sans small" x="60" y="260">inductor</text>
  <rect x="330" y="235" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="235" width="494.12" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="259" text-anchor="end">12</text>
  <text class="sans small" x="60" y="310">constant voltage</text>
  <rect x="330" y="285" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="285" width="329.41" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="309" text-anchor="end">8</text>
  <text class="sans small" x="60" y="360">diode</text>
  <rect x="330" y="335" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="335" width="247.06" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="359" text-anchor="end">6</text>
  <text class="sans small" x="60" y="410">initial capacitor voltage</text>
  <rect x="330" y="385" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="385" width="205.88" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="409" text-anchor="end">5</text>
  <text class="sans small" x="60" y="460">pulse control</text>
  <rect x="330" y="435" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="435" width="205.88" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="459" text-anchor="end">5</text>
  <text class="sans small" x="60" y="510">switch</text>
  <rect x="330" y="485" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="485" width="205.88" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="509" text-anchor="end">5</text>
  <text class="sans small" x="60" y="560">sine voltage</text>
  <rect x="330" y="535" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="535" width="164.71" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="559" text-anchor="end">4</text>
  <text class="sans small" x="60" y="610">initial inductor current</text>
  <rect x="330" y="585" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="585" width="82.35" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="609" text-anchor="end">2</text>
  <text class="sans small" x="60" y="660">four switch schedule</text>
  <rect x="330" y="635" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="635" width="41.18" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="659" text-anchor="end">1</text>
  <text class="sans small" x="60" y="710">pwl current</text>
  <rect x="330" y="685" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="685" width="41.18" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="709" text-anchor="end">1</text>
  <text class="sans small" x="60" y="760">pwl voltage</text>
  <rect x="330" y="735" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="735" width="41.18" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="759" text-anchor="end">1</text>
  <text class="sans small" x="60" y="810">scaled diode thermal voltage</text>
  <rect x="330" y="785" width="730" height="34" rx="9" fill="#e2ecf2"/>
  <rect x="330" y="785" width="41.18" height="34" rx="9" fill="url(#brand)"/>
  <text class="sans label" x="1110" y="809" text-anchor="end">1</text>
</svg>
