[project]
name = "bab-cs"
version = "1.1.0"
description = "Bounded-authority-based circuit simulation reference implementation"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
sparse = ["scipy>=1.11"]

[project.scripts]
babcs = "babcs.cli:main"

[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
