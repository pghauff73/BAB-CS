name: Release Qualification

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Exact Source and Wheel Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Resolve exact release identity
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          version="$(PYTHONPATH=src python -c 'from babcs._project import VERSION; print(VERSION)')"
          wheel="$(PYTHONPATH=src python -c 'from babcs._project import wheel_filename; print(wheel_filename())')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="candidate-${source_commit:0:12}"
          fi
          created_utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          SOURCE_COMMIT="${source_commit}" TAG="${tag}" VERSION="${version}" PYTHONPATH=src \
            python -c \
            'from tools.release_evidence import validate_release_identity; import os; validate_release_identity(os.environ["SOURCE_COMMIT"], os.environ["TAG"], allow_candidate=True)'
          echo "BABCS_SOURCE_COMMIT=${source_commit}" >> "${GITHUB_ENV}"
          echo "BABCS_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "BABCS_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "BABCS_WHEEL=${wheel}" >> "${GITHUB_ENV}"
          echo "BABCS_CREATED_UTC=${created_utc}" >> "${GITHUB_ENV}"

      - name: Install external qualification dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ngspice

      - name: Record base environment
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts/release
          python tools/release_evidence.py record-environment \
            --output-dir artifacts/release \
            --source-commit "${BABCS_SOURCE_COMMIT}" \
            --tag "${BABCS_TAG}" \
            --created-utc "${BABCS_CREATED_UTC}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --workflow-event "${GITHUB_EVENT_NAME}" \
            --workflow-ref "${GITHUB_REF}" \
            --workflow-sha "${BABCS_SOURCE_COMMIT}"

      - name: Compile qualification sources
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          python -m compileall -q -f src tests tools build_backend.py \
            2>&1 | tee artifacts/release/compile.log

      - name: Run dependency-free full source qualification
        env:
          BABCS_LONG_TESTS: "1"
          BABCS_VERY_LONG_TESTS: "1"
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          python -m unittest discover -s tests -v \
            2>&1 | tee artifacts/release/source-tests.log

      - name: Create SciPy source environment
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf /tmp/babcs-source-scipy
          {
            python -m venv /tmp/babcs-source-scipy
            /tmp/babcs-source-scipy/bin/python -m pip install --upgrade pip
            /tmp/babcs-source-scipy/bin/python -m pip install "scipy>=1.11"
          } 2>&1 | tee artifacts/release/source-scipy-install.log
          /tmp/babcs-source-scipy/bin/python -c \
            'import scipy; print(scipy.__version__)' \
            > artifacts/release/SCIPY_VERSION

      - name: Run SciPy full source qualification
        env:
          BABCS_LONG_TESTS: "1"
          BABCS_VERY_LONG_TESTS: "1"
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          /tmp/babcs-source-scipy/bin/python -m unittest discover -s tests -v \
            2>&1 | tee artifacts/release/source-scipy-tests.log

      - name: Generate source numerical evidence
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          /tmp/babcs-source-scipy/bin/python tools/compare_methods.py \
            --output artifacts/release/source-comparison.json \
            --csv-output artifacts/release/source-comparison.csv \
            --plot-output artifacts/release/source-comparison.svg \
            --timing-output artifacts/release/source-timing.json \
            --timing-repeats 3 \
            2>&1 | tee artifacts/release/source-comparison.log

      - name: Inspect complete comparison matrix
        env:
          PYTHONPATH: src
        run: |
          /tmp/babcs-source-scipy/bin/python tools/release_evidence.py inspect-comparison \
            --report artifacts/release/source-comparison.json \
            --manifest benchmarks/manifest.json \
            --source-commit "${BABCS_SOURCE_COMMIT}" \
            --timing-report artifacts/release/source-timing.json \
            --output artifacts/release/comparison-inspection.json

      - name: Generate ngspice cross-implementation evidence
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          for case in rc_step rl_step diode_clip switched_rc; do
            /tmp/babcs-source-scipy/bin/python tools/compare_external.py \
              "benchmarks/cases/${case}.json" \
              --output "artifacts/release/ngspice-${case}.json" \
              --netlist-output "artifacts/release/ngspice-${case}.cir" \
              --raw-output "artifacts/release/ngspice-${case}.dat" \
              --log-output "artifacts/release/ngspice-${case}.log"
          done

      - name: Build candidate wheel twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/build-a artifacts/build-b
          set -o pipefail
          python -m pip wheel . --no-deps --wheel-dir artifacts/build-a \
            2>&1 | tee artifacts/release/wheel-build-a.log
          python -m pip wheel . --no-deps --wheel-dir artifacts/build-b \
            2>&1 | tee artifacts/release/wheel-build-b.log
          cmp "artifacts/build-a/${BABCS_WHEEL}" "artifacts/build-b/${BABCS_WHEEL}"
          cp "artifacts/build-a/${BABCS_WHEEL}" artifacts/release/
          (
            cd artifacts/release
            sha256sum "${BABCS_WHEEL}" > WHEEL_SHA256
          )
          python -m zipfile -l "artifacts/release/${BABCS_WHEEL}" \
            > artifacts/release/WHEEL_CONTENTS

      - name: Inspect exact wheel identity
        env:
          PYTHONPATH: src
        run: |
          python tools/release_evidence.py inspect-wheel \
            --wheel "artifacts/release/${BABCS_WHEEL}" \
            --repository-root . \
            --output artifacts/release/wheel-inspection.json

      - name: Verify dependency-free installed wheel
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf /tmp/babcs-release-wheel
          {
            python -m venv /tmp/babcs-release-wheel
            /tmp/babcs-release-wheel/bin/python -m pip install --no-deps \
              "artifacts/release/${BABCS_WHEEL}"
            /tmp/babcs-release-wheel/bin/python -m pip check
          } 2>&1 | tee artifacts/release/installed-wheel-install.log
          /tmp/babcs-release-wheel/bin/python -c \
            'import babcs; print(babcs.__file__)' \
            > artifacts/release/INSTALLED_PACKAGE_PATH
          BABCS_LONG_TESTS=1 BABCS_VERY_LONG_TESTS=1 \
            /tmp/babcs-release-wheel/bin/python -m unittest discover -s tests -v \
            2>&1 | tee artifacts/release/installed-wheel-tests.log

      - name: Verify SciPy installed wheel
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          /tmp/babcs-release-wheel/bin/python -m pip install "scipy>=1.11" \
            2>&1 | tee artifacts/release/installed-wheel-scipy-install.log
          /tmp/babcs-release-wheel/bin/python -c \
            'import scipy; print(scipy.__version__)' \
            > artifacts/release/INSTALLED_SCIPY_VERSION
          BABCS_LONG_TESTS=1 BABCS_VERY_LONG_TESTS=1 \
            /tmp/babcs-release-wheel/bin/python -m unittest discover -s tests -v \
            2>&1 | tee artifacts/release/installed-wheel-scipy-tests.log

      - name: Generate installed-wheel numerical evidence
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          /tmp/babcs-release-wheel/bin/python tools/compare_methods.py \
            --output artifacts/release/installed-wheel-comparison.json \
            --csv-output artifacts/release/installed-wheel-comparison.csv \
            --plot-output artifacts/release/installed-wheel-comparison.svg \
            2>&1 | tee artifacts/release/installed-wheel-comparison.log

      - name: Verify source and installed numerical identity
        env:
          PYTHONPATH: src
        run: |
          python tools/release_evidence.py compare-artifacts \
            --pair artifacts/release/source-comparison.json=artifacts/release/installed-wheel-comparison.json \
            --pair artifacts/release/source-comparison.csv=artifacts/release/installed-wheel-comparison.csv \
            --pair artifacts/release/source-comparison.svg=artifacts/release/installed-wheel-comparison.svg \
            --output artifacts/release/artifact-comparison.json

      - name: Build and verify release evidence manifest
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_evidence.py write-manifest \
            --evidence-dir artifacts/release \
            --source-commit "${BABCS_SOURCE_COMMIT}" \
            --tag "${BABCS_TAG}" \
            --wheel "${BABCS_WHEEL}" \
            --requirements-file release-evidence-required.txt
          wheel_sha="$(cut -d ' ' -f 1 artifacts/release/WHEEL_SHA256)"
          python tools/release_evidence.py verify \
            --evidence-dir artifacts/release \
            --source-commit "${BABCS_SOURCE_COMMIT}" \
            --tag "${BABCS_TAG}" \
            --wheel-sha256 "${wheel_sha}"

      - name: Upload release qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bab-cs-release-qualification
          path: artifacts/release
          if-no-files-found: error
          retention-days: 90
