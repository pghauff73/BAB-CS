name: Release Qualification

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Source and Installed-Wheel Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run full source qualification
        env:
          BABCS_LONG_TESTS: "1"
          BABCS_VERY_LONG_TESTS: "1"
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build candidate wheel
        run: |
          mkdir -p artifacts/release
          python -m pip wheel . --no-deps --wheel-dir artifacts/release
          sha256sum artifacts/release/*.whl > artifacts/release/SHA256SUMS

      - name: Verify installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/babcs-release-wheel
          /tmp/babcs-release-wheel/bin/python -m pip install --no-deps artifacts/release/*.whl
          /tmp/babcs-release-wheel/bin/python -m pip check
          /tmp/babcs-release-wheel/bin/python -m unittest discover -s tests -v
          /tmp/babcs-release-wheel/bin/python tools/compare_methods.py \
            --output artifacts/release/installed-wheel-comparison.json \
            --csv-output artifacts/release/installed-wheel-comparison.csv \
            --plot-output artifacts/release/installed-wheel-comparison.svg \
            | tee artifacts/release/comparison.log

      - name: Record provenance
        run: |
          git rev-parse HEAD > artifacts/release/SOURCE_COMMIT
          python --version > artifacts/release/PYTHON_VERSION
          sha256sum artifacts/release/installed-wheel-comparison.* artifacts/release/comparison.log \
            >> artifacts/release/SHA256SUMS

      - name: Upload release qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bab-cs-release-qualification
          path: artifacts/release
          if-no-files-found: error
          retention-days: 90
